name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Dark variant
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-dark.svg
          base: header, repositories
          config_timezone: Europe/Istanbul
          config_display: large
          template: classic
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: jupyter notebook
          plugin_languages_details: percentage
          plugin_lines: yes

      - name: Light variant
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-light.svg
          base: header, repositories
          config_timezone: Europe/Istanbul
          config_display: large
          template: classic
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: jupyter notebook
          plugin_languages_details: percentage
          plugin_lines: yes
